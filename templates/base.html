<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/style_profile.css">
    <link rel="stylesheet" href="static/css/style.css">
    <title>{{title}}</title>
    <style>
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-light bg-dark">
        <a class="navbar-light" href="/" style="text-decoration: none"><h1>Авито</h1></a>
        <div>
            <a class="btn btn-success" href="/add">Разместить объявление</a>
            {% if current_user.is_authenticated %}
            <a class="btn btn-primary" href="/logout">Выход</a>
            <a class="navbar-brand" style="color:#ffffff" href="/profile/{{current_user.id}}" id="profile_name">{{current_user.login}}</a>
            {% else %}
            <p>
                <a class="btn btn-primary " href="/register">Зарегистрироваться</a>
                <a class="btn btn-success" href="/login">Войти</a>
            </p>
            {% endif %}
        </div>
    </nav>

</header>
<main role="main" class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
