<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" type="image/png" sizes="16x16" href="https://uust.ru/static/New_files_ugatu/images/redesign/favicon/favicon-16x16.png">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_main.css') }}">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style_maps.css') }}">  -->

    <link rel="stylesheet" href="static/css/style_profile.css"> 
    <!-- этого файла нет сверху -->
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>{{title}}</title>
    <style>
    </style>
</head>
<body>
<header>
     <nav class="navbar navbar-light bg-dark">
         <a class="navbar-dark" href="/" style="text-decoration: none; color: yellow"><h1>ИИМРТ</h1></a>
        <div>
            {% if current_user.is_authenticated %}
            <a class="btn btn-warning" href="/logout">Выход</a>
            <a class="navbar-brand" style="color:#ffffff" href="/profile/{{current_user.id}}" id="profile_name">{{current_user.login}}</a>
            {% else %}
            <p>
                <a class="btn btn-warning " href="/register">Зарегистрироваться</a>
                <a class="btn btn-warning" href="/login">Войти</a>
            </p>
            {% endif %}
        </div>
    </nav>
</header>
<main role="main" class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
